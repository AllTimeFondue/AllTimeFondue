<svg fill="none" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  	<foreignObject height="100%" width="100%">
		<div xmlns="http://www.w3.org/1999/xhtml" style="height:100%; width:100%;">
			<style>
				.wrapper {
					box-sizing: border-box;
					height: 100%;
					width: 100%;

					background-image: linear-gradient(to top, #30cfd0 0%, #330867 100%);
					
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: space-evenly;

					padding: 16px;
				}
        		.title {

					display: flex;
					align-items: center;
					justify-content: center;

					color: #cad2c5;
					font-size: xx-large;
					font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
					font-weight: 800;
        		}  
				.techStack {
					display: flex;
					flex-direction: row;
					align-items: center;
					justify-content: space-evenly;
					gap: 2rem;
					width: 80%;
					background-color: #cad2c5;
					border-radius: 9999px;
					padding: 0.5rem;
				}
				.techStackItem {
					display: flex;
					align-items: center;
					justify-content: center;
					color: #cad2c5;
					background-color: rgba(47, 62, 70, 1); 
					border-radius: 9999px;
					padding:2rem;
				}
    		</style>



			<div class="wrapper">
				<div class="title">
					Welcome wanderer !
				</div>

				<div class="techStack">
				 
					<div class="techStackItem">
						Git
					</div>

					<div class="techStackItem">
						C / C++
					</div>

					<div class="techStackItem">
						Js / Ts
					</div>

					<div class="techStackItem">
						HTML / CSS
					</div>

					<div class="techStackItem">
						Docker
					</div>

				</div>
			</div>


    	</div>
	</foreignObject>
</svg>
